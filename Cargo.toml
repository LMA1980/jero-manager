[package]
name = "jero-manager"
description = "Control plane and IPC daemon for the SpacemiT K3 AI platform"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "AGPL-3.0-only"
repository = "https://github.com/LMA1980/jero-manager"
default-run = "jero-manager"

[[bin]]
name = "jero-manager"
path = "src/main.rs"

[[bin]]
name = "k3-store"
path = "src/bin/k3-store.rs"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
unused_qualifications = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "warn"

[dependencies]
jero-arch-mistral = { version = "0.1.0", git = "https://github.com/LMA1980/jero-arch-mistral.git", branch = "main", default-features = false }
jero-core = { version = "0.1.0", git = "https://github.com/LMA1980/jero-core.git", branch = "main" }
jero-tokenizer = { version = "0.1.0", git = "https://github.com/LMA1980/jero-tokenizer.git", branch = "main" }
jero-kernels-rvv = { version = "0.1.0", git = "https://github.com/LMA1980/jero-kernels-rvv.git", branch = "main" }
mu-observable-ipc = { version = "0.1.0", git = "https://github.com/LMA1980/mu-observable-ipc.git", branch = "main" }
mu-auth = { version = "0.1.0", git = "https://github.com/LMA1980/mu-auth.git", branch = "main", features = ["github-oauth"] }
arrow-array = "59.3.1"
arrow-buffer = "59.3.1"
arrow-schema = "59.3.1"
fory = "1.7.7"
libc = "0.2"
tokio = { version = "1.54.1", features = ["process", "rt", "net", "io-util", "sync", "macros", "signal", "time"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
zerocopy = { version = "0.8.63", features = ["derive"] }
duckdb = { version = "=1.2.2", default-features = false }

[dev-dependencies]
jero-kv-cache = { version = "0.1.0", git = "https://github.com/LMA1980/jero-kv-cache.git", branch = "main" }
