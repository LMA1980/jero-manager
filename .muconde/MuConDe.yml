version: "1"
service: "jero-manager"

target_nodes:
  - "worker-riscv64"
  - "node-a"

lease_ttl_seconds: 300
warmup_timeout_seconds: 30
bake_window_seconds: 60
max_error_logs: 0
max_p99_latency_ms: 250.0
integration_tests: "all"

deployment:
  target_nodes:
    - "worker-riscv64"
    - "node-a"
  binary: "k3-store"
  install_path: "/usr/local/bin/k3-store"
  systemd_unit: "jero-manager.service"

verification:
  bake_window_secs: 60
  rollback_on_failure: true
